<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="23CSE304 Embedded Systems – interactive lessons, STM32F401 hardware simulations, lab walkthroughs and PYQ solutions." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='7' y='7' width='18' height='18' rx='2' fill='%23121A21' stroke='%23D4A84B' stroke-width='2'/%3E%3Cpath d='M11 3v4M16 3v4M21 3v4M11 25v4M16 25v4M21 25v4M3 11h4M3 16h4M3 21h4M25 11h4M25 16h4M25 21h4' stroke='%23D4A84B' stroke-width='2'/%3E%3C/svg%3E" />
    <title>ES Interactive Lab</title>
    <script>
      try { var t = localStorage.getItem('esl-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
    </script>
    <!-- Paint the theme background before the stylesheet arrives, so the page is never a blank white screen. -->
    <style>
      html, body { margin: 0; background: #121a21; color: #e9e6dc; }
      html[data-theme='light'], html[data-theme='light'] body { background: #f7f6f1; color: #1b2630; }
      #boot-help { max-width: 640px; margin: 12vh auto 0; padding: 0 16px; font: 16px/1.6 system-ui, 'Segoe UI', sans-serif; }
      #boot-help h1 { font-size: 24px; margin: 0 0 12px; }
      #boot-help code { font-family: Consolas, monospace; background: rgba(212, 168, 75, 0.15); padding: 1px 5px; border-radius: 3px; }
      #boot-help li { margin: 6px 0; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <noscript>This site needs JavaScript for its simulations and quizzes.</noscript>
    <!-- Shown only if the app has not started after a few seconds (for example, this source page opened from disk). -->
    <div id="boot-help" hidden>
      <h1>The lab did not start</h1>
      <p id="boot-why">The app's code could not be loaded.</p>
      <ul>
        <li>To use it from disk: run <code>npm run build</code> in the <code>embedded-systems-platform</code> folder, then double-click <code>dist/index.html</code>.</li>
        <li>Or run <code>npm run dev</code> and open <code>http://localhost:5173</code>.</li>
      </ul>
    </div>
    <script>
      setTimeout(function () {
        var root = document.getElementById('root');
        var help = document.getElementById('boot-help');
        if (!help || (root && root.childNodes.length)) return;
        if (location.protocol === 'file:')
          document.getElementById('boot-why').textContent =
            'This page was opened from disk, but its code is in separate files that browsers refuse to load from disk. Open the self-contained build instead.';
        help.hidden = false;
      }, 3000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
